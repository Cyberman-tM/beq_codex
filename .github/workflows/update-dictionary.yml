name: Update Klingon dictionary

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "boQwI' data branch, tag or commit"
        required: true
        default: main

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: Generate SQLite database
    runs-on: ubuntu-latest
    env:
      SOURCE_REF: ${{ inputs.source_ref }}

    steps:
      - name: Check out beq_codex
        uses: actions/checkout@v4

      - name: Check out boQwI' data
        uses: actions/checkout@v4
        with:
          repository: De7vID/klingon-assistant-data
          ref: ${{ inputs.source_ref }}
          path: .tmp/klingon-assistant-data

      - name: Install generator tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes sqlite3 python3-venv
          python3 -m venv .venv
          .venv/bin/pip install PyYAML
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Generate qawHaq.db
        working-directory: .tmp/klingon-assistant-data
        run: ./generate_db_yaml.sh --noninteractive

      - name: Prepare update
        shell: bash
        run: |
          set -euo pipefail
          test -s .tmp/klingon-assistant-data/qawHaq.db
          mkdir -p bot/data
          cp .tmp/klingon-assistant-data/qawHaq.db bot/data/qawHaq.db

          source_commit="$(git -C .tmp/klingon-assistant-data rev-parse HEAD)"
          version="$(tr -d '\r\n' < .tmp/klingon-assistant-data/VERSION)"
          generated_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          {
            echo "Source: https://github.com/De7vID/klingon-assistant-data"
            echo "Source ref: ${SOURCE_REF}"
            echo "Source commit: ${source_commit}"
            echo "Database version: ${version}"
            echo "Generated at: ${generated_at}"
          } > bot/data/SOURCE.txt

      - name: Create pull request
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          branch="data/update-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add bot/data/qawHaq.db bot/data/SOURCE.txt

          if git diff --cached --quiet; then
            echo "No dictionary changes found."
            exit 0
          fi

          git commit -m "Update Klingon dictionary"
          git push --set-upstream origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "Update Klingon dictionary" \
            --body "Automated update from the boQwI' data repository. Please review bot/data/SOURCE.txt before merging."
